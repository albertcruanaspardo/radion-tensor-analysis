<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Memoria Técnica: Foliación Modular</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [["$", "$"]],
    displayMath: [["$$", "$$"]]
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    color: #24292e;
  }
  h1 { border-bottom: 2px solid #eaecef; padding-bottom: 0.3em; }
  h2 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin-top: 24px; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  th, td { border: 1px solid #dfe2e5; padding: 8px 12px; text-align: left; }
  th { background-color: #f6f8fa; }
  code, pre { background: #f6f8fa; border-radius: 4px; font-family: monospace; }
  pre { padding: 12px; overflow-x: auto; }
  hr { border: none; border-top: 1px solid #e1e4e8; margin: 24px 0; }
  @media print {
    body { max-width: 100%; margin: 0; padding: 15mm; }
  }
</style>
</head>
<body>
<pre style="white-space: pre-wrap; font-family: inherit; background: none; padding: 0;">

</pre>
</body>
</html>
